<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technical Installations | Order Page</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body, html {
  margin:0; padding:0;
  font-family:Poppins, sans-serif;
  background:#121212;
  color:white;
}

.hero {
  text-align:center;
  padding:40px 20px;
  background:#0d6efd;
}

.catalog {
  max-width:1000px;
  margin:30px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap:20px;
}

.catalog-card {
  background:#1a1a1a;
  border: 2px solid #25d366;
  border-radius:12px;
  padding:20px;
}

.catalog-card h3 {color:#25d366}

.catalog-card button {
  margin-top:15px;
  width:100%;
  padding:10px;
  border:none;
  border-radius:6px;
  background:#25d366;
  font-weight:bold;
  cursor:pointer;
}

.modal-bg {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
}

.modal-box {
  background:#1a1a1a;
  color:#25d366;
  max-width:500px;
  padding:25px;
  border-radius:12px;
  border:2px solid #25d366;
}

.modal-box input,.modal-box textarea{
  width:100%;padding:10px;margin-top:5px;
  border:1px solid #25d366;background:#121212;color:white;
}

.send-btn {background:#25d366;color:black;margin-top:15px}
.close-btn {background:#dc3545;color:white;margin-top:10px}

#countdown{
  margin-top:10px;
  color:#25d366;
  font-size:.9rem;
}
</style>
</head>

<body>

<header class="hero">
  <h1>Technical Installations & Studio Setup</h1>
  <p>Professional setup of media studios, streaming, projection & AV systems</p>
</header>

<section class="catalog">

<div class="catalog-card">
<h3>Live Streaming Studio Setup</h3>
<button onclick="openModal('Live Streaming Studio Setup')">Order Now</button>
</div>

<div class="catalog-card">
<h3>Music Studio Installation</h3>
<button onclick="openModal('Music Studio Installation')">Order Now</button>
</div>

<div class="catalog-card">
<h3>Video Production Studio Setup</h3>
<button onclick="openModal('Video Production Studio Setup')">Order Now</button>
</div>

<div class="catalog-card">
<h3>Church Live Projection & Streaming</h3>
<button onclick="openModal('Church Live Projection & Streaming')">Order Now</button>
</div>

<div class="catalog-card">
<h3>Conference & Seminar Setup</h3>
<button onclick="openModal('Conference & Seminar Setup')">Order Now</button>
</div>

<div class="catalog-card">
<h3>Projection System Installation</h3>
<button onclick="openModal('Projection System Installation')">Order Now</button>
</div>

</section>

<div class="modal-bg" id="orderModal">
<div class="modal-box">

<h2 id="modalTitle"></h2>

<input id="clientName" placeholder="Full Name">
<input id="clientPhone" placeholder="Phone / WhatsApp">
<input id="clientLocation" placeholder="Location">
<textarea id="clientNotes" placeholder="Additional Requirements"></textarea>

<button class="send-btn" onclick="sendOrder()">Generate PDF & Send</button>
<button class="close-btn" onclick="closeModal()">Cancel</button>

<div id="countdown"></div>

</div>
</div>

<script>
let selectedService="";

function openModal(service){
  selectedService=service;
  document.getElementById("modalTitle").innerText=service;
  document.getElementById("orderModal").style.display="flex";
}

function closeModal(){
  document.getElementById("orderModal").style.display="none";
}

function sendOrder(){
  const name=document.getElementById("clientName").value;
  const phone=document.getElementById("clientPhone").value;
  const location=document.getElementById("clientLocation").value;
  const notes=document.getElementById("clientNotes").value;

  if(!name || !phone || !location){
    alert("Please fill all required fields.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF();

  pdf.text("Installation Order",20,20);
  pdf.text(`Service: ${selectedService}`,20,30);
  pdf.text(`Name: ${name}`,20,40);
  pdf.text(`Phone: ${phone}`,20,50);
  pdf.text(`Location: ${location}`,20,60);
  pdf.text(`Notes: ${notes}`,20,70);

  pdf.save("installation_order.pdf");

  let t=3;
  const cd=document.getElementById("countdown");

  const timer=setInterval(()=>{
    t--;

    if(t>0){
      cd.textContent=`Redirecting in ${t}s...`;
    }else{
      clearInterval(timer);

      cd.textContent="Opening WhatsApp... Tap SEND to confirm";

      const msg=`Installation Request:
Service: ${selectedService}
Name: ${name}
Phone: ${phone}
Location: ${location}
Notes: ${notes}`;

      const whatsappNumber="2348128965563";

      window.location.href=`https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodeURIComponent(msg)}`;
    }

  },1000);
}
</script>

</body>
</html>
