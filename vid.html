<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dextimani - Video & Photography Services</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body,html{margin:0;padding:0;height:100%;background:#121212;background-image:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),url('https://www.transparenttextures.com/patterns/dark-leather.png');font-family:'Segoe UI',Tahoma,Verdana,sans-serif;color:white;text-align:center;overflow-x:hidden}
.fade-in{animation:fadeIn 1.5s forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1}}
header{padding:40px 20px}
.brand-name{font-size:1.2rem;letter-spacing:2px;font-weight:bold}
h1{font-size:2rem;color:#d1f1ff;margin:10px 0;text-transform:uppercase}
.neon-text{color:#39FF14;font-size:2.3rem;font-weight:900;margin:20px 0 5px;text-shadow:0 0 10px rgba(57,255,20,.5)}
.instruction{color:#FFD700;font-size:.9rem;font-weight:bold;margin-bottom:30px}
.carousel-container{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:20px;padding:20px;scrollbar-width:none}
.carousel-container::-webkit-scrollbar{display:none}
.card{flex:0 0 70%;max-width:300px;scroll-snap-align:center;background:white;border-radius:20px;overflow:hidden;transition:transform 0.3s ease;cursor:pointer}
.card img{width:100%;height:auto;display:block}
.card:active{transform:scale(0.95)}
.label-container{display:flex;justify-content:center;gap:40px;margin-top:15px;font-weight:bold;color:#FFD700;flex-wrap:wrap}
.order-btn{margin-top:30px;background:transparent;border:4px solid #39FF14;color:#FFD700;padding:12px 40px;font-size:1.5rem;font-weight:bold;border-radius:5px;cursor:pointer;transition:.3s}
.order-btn:hover{background:#39FF14;color:black}
.footer-desc{margin-top:20px;color:#FFD700;font-size:1.1rem;padding:0 20px;line-height:1.4}
input,select,textarea,button{border-radius:5px}
.countdown{color:#39FF14;font-weight:bold;margin-top:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;overflow:auto}
.modal-box{background:#111;color:#FFD700;max-width:520px;margin:40px auto;padding:25px;border-radius:15px;border:2px solid #39FF14;text-align:left}
.modal-box label{display:block;margin-top:10px}
.modal-box input, .modal-box select, .modal-box textarea{width:100%;padding:8px;margin-top:5px;background:#222;color:#FFD700;border:1px solid #39FF14}
.modal-box button{margin-top:15px;background:#39FF14;color:black;border:none;padding:10px 20px;cursor:pointer}
.modal-box button:hover{background:#FFD700;color:black}
</style>
</head>

<body>

<div class="fade-in">
<header>
<div class="brand-name">DEXTIMANI STUDIOS</div>
<h1>Video Coverage, Photography<br> & Live Streaming Services</h1>
<p>Book Professional Media Services for Events, Businesses & Productions</p>
</header>

<div class="neon-text">VIDEO COVERAGE</div>
<div id="videoCarousel" class="carousel-container"></div>
<button class="order-btn" onclick="openModal('video')">Book Video Coverage</button>

<div class="neon-text">PHOTOGRAPHY</div>
<div id="photoCarousel" class="carousel-container"></div>
<button class="order-btn" onclick="openModal('photo')">Book Photography</button>

<div class="neon-text">LIVE STREAMING</div>
<div id="streamCarousel" class="carousel-container"></div>
<button class="order-btn" onclick="openModal('stream')">Book Live Streaming</button>

</div>

<div id="orderModal" class="modal">
<div class="modal-box">
<h2 id="modalTitle">Place Your Order</h2>
<form id="orderForm">

<label>Name:</label>
<input type="text" id="clientName" required>

<label>Address:</label>
<input type="text" id="clientAddress" required>

<label>Project Type:</label>
<input type="text" id="businessType" required>

<label>Service:</label>
<select id="itemType"></select>

<label>Price:</label>
<input type="number" id="price" readonly>

<label>Date:</label>
<input type="date" id="orderDate" required>

<button type="submit">Submit Order</button>
<button type="button" onclick="closeModal()">Cancel</button>

<div id="countdown" class="countdown"></div>

</form>
</div>
</div>

<script>
const categoryOptions={
video:["Wedding","Church","Corporate","Music Video"],
photo:["Studio","Outdoor","Wedding"],
stream:["Single Cam","Multi Cam"]
};

const categoryPrices={
video:150000,
photo:50000,
stream:200000
};

const orderModal=document.getElementById('orderModal');
const itemTypeSelect=document.getElementById('itemType');
const priceInput=document.getElementById('price');

function openModal(category){
itemTypeSelect.innerHTML="";
categoryOptions[category].forEach(opt=>{
let el=document.createElement('option');
el.value=opt;
el.textContent=opt;
itemTypeSelect.appendChild(el);
});
priceInput.value=categoryPrices[category];
orderModal.style.display="block";
}

function closeModal(){
orderModal.style.display="none";
}

document.getElementById('orderForm').addEventListener('submit',function(e){
e.preventDefault();

const name=document.getElementById('clientName').value;
const address=document.getElementById('clientAddress').value;
const business=document.getElementById('businessType').value;
const type=itemTypeSelect.value;
const price=priceInput.value;
const date=document.getElementById('orderDate').value;

let countdown=3;
const cd=document.getElementById('countdown');

const interval=setInterval(()=>{
countdown--;

if(countdown>0){
cd.textContent=`Redirecting in ${countdown}...`;
}else{
clearInterval(interval);

cd.textContent="Opening WhatsApp... Tap SEND to complete booking";

const phone="2348128965563";

const text=`New Booking:
Name: ${name}
Service: ${type}
Price: ₦${price}
Project: ${business}
Address: ${address}
Date: ${date}`;

window.location.href=`https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(text)}`;
}
},1000);

});
</script>

</body>
</html>
